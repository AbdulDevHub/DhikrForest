    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is DhikrForest?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "DhikrForest is a free online dhikr counter and digital tasbih. Each time you say a dhikr such as SubhanAllahi wa bihamdihi and tap the button, a tree is planted in your personal forest, a visual reminder of the trees promised in Jannah."
            }
          },
          {
            "@type": "Question",
            "name": "Which hadith says dhikr plants trees in Jannah?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The Prophet ﷺ said: whoever says SubhanAllahil-Azim wa bihamdihi, a palm tree is planted for him in Paradise (Jami at-Tirmidhi 3464). He also taught that each of SubhanAllah, Alhamdulillah, La ilaha illallah and Allahu Akbar plants a tree in Paradise (Sunan Ibn Majah 3807)."
            }
          },
          {
            "@type": "Question",
            "name": "Does the dhikr counter work offline?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. DhikrForest saves your forest on your device and can be installed to your home screen as an app, so it works fully offline. Signing in is optional."
            }
          },
          {
            "@type": "Question",
            "name": "How does the leaderboard work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sign in with Google and pick a public nickname. Trees you plant while signed in count toward the weekly and all-time leaderboards. Totals are checked on the server at a human pace to keep it fair, and your real name and email are never shown."
            }
          },
          {
            "@type": "Question",
            "name": "What is Laylatul Qadr mode?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The Night of Decree is better than a thousand months (Quran 97:3). During the last ten nights of Ramadan you can switch on Laylatul Qadr mode once per year; until Fajr, every dhikr plants golden trees worth 1,000 each."
            }
          }
        ]
      }
    </script>
